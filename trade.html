<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <title>Escrow Trade Order - Etp2p</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1018;
      --panel: #111a24;
      --soft: #182532;
      --line: #293a4a;
      --text: #edf3fa;
      --muted: #9aabba;
      --green: #f0b90b;
      --green-ink: #0a1018;
      --amber: #f5ad28;
      --amber-soft: #302300;
    }

    body.light-mode {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #fff;
      --soft: #edf2f7;
      --line: #dce5ee;
      --text: #182434;
      --muted: #66788a;
      --green: #c99a00;
      --green-ink: #fff;
      --amber: #b35f00;
      --amber-soft: #fff3d0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color .24s cubic-bezier(0.16, 1, 0.3, 1), color .24s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Touch Feedback & Smooth Animations */
    button, input, select, a {
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }
    .btn:active, .copy-btn:active, .brand:active {
      transform: scale(0.96);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--green);
      color: var(--green-ink);
      font-weight: 800;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover { background: var(--soft); }
    .btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: var(--green-ink);
    }
    .btn.primary:hover { opacity: .9; }
    .btn.small { padding: 6px 14px; font-size: 13px; }
    .btn.outline { border-color: var(--line); }

    .escrow-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--soft);
      border: 1px solid var(--green);
      margin-bottom: 20px;
    }

    .status-badge {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .status-pending { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); }
    .status-paid { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid #3b82f6; }
    .status-completed { background: rgba(252,213,53,0.14); color: var(--green); border: 1px solid var(--green); }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .detail-item {
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .detail-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .detail-val { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 2px; }
    .detail-val.green { color: var(--green); }

    /* Rich Bank Details Box */
    .bank-card-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .bank-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      gap: 12px;
    }
    .bank-row-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .bank-row-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bank-row-val {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 2px;
      word-break: break-all;
    }
    .copy-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--soft); }
    .copy-btn.copied {
      background: var(--green);
      color: var(--green-ink);
      border-color: var(--green);
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding: 12px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .chat-bubble {
      padding: 8px 14px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 13px;
    }
    .chat-bubble.merchant {
      background: var(--panel);
      border: 1px solid var(--line);
      align-self: flex-start;
    }
    .chat-bubble.you {
      background: var(--green);
      color: var(--green-ink);
      align-self: flex-end;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--text);
      color: var(--panel);
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 60;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Orders Modal Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      place-items: center;
      padding: 16px;
    }
    .modal-overlay.show { display: grid; }
    .orders-sheet {
      width: min(560px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .topbar, .card, .escrow-banner, .detail-item, .bank-detail-row, .orders-sheet {
      transition: background-color .24s ease, color .24s ease, border-color .24s ease, box-shadow .24s ease;
    }

    @media (max-width: 600px) {
      .topbar { padding: 8px 10px; gap: 6px; }
      .topbar > div { gap: 6px !important; }
      .topbar .btn.small { padding: 6px 8px; font-size: 11px; }
      .topbar .brand { font-size: 15px; }
      .page { width: 100%; min-width: 0; padding: 14px 10px 40px; }
      .card { padding: 14px; }
      .escrow-banner { padding: 14px; }
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .bank-detail-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .copy-btn { width: 100%; justify-content: center; }
      #orderActions .btn { min-width: 0 !important; width: 100%; }
    }
    @keyframes themeTogglePop { 50% { transform: scale(1.08); } }
    body.theme-changing #themeToggleBtn { animation: themeTogglePop .42s cubic-bezier(.2,.8,.2,1); }

    @media (pointer: coarse) {
      .topbar { padding: 8px 10px; gap: 6px; }
      .topbar > div { gap: 6px !important; }
      .topbar .btn.small { padding: 6px 8px; font-size: 11px; }
      .page { width: 100%; max-width: 100%; min-width: 0; padding: 14px 10px 40px; }
      .card { padding: 14px; }
      .escrow-banner { padding: 14px; }
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .bank-detail-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .copy-btn { width: 100%; justify-content: center; }
      #orderActions .btn { min-width: 0 !important; width: 100%; }
    }

    @media (max-width: 380px) {
      .topbar .brand { display: none; }
      .topbar > div:first-child { flex: 1; }
      .topbar > div:last-child { margin-left: auto; }
      .orders-sheet { padding: 16px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="topbar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="./" class="btn small outline" title="Back to Marketplace">← Marketplace</a>
      <a class="brand" href="./"><span class="mark">E</span>Etp2p</a>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn small primary" id="headerMyOrdersBtn" title="View all your P2P orders" style="white-space:nowrap; padding:6px 11px; font-size:12px;">
        📋 Orders (<span id="ordersCountBadge">1</span>)
      </button>
      <button class="btn small" id="themeToggleBtn" style="white-space:nowrap;">🌙 Dark</button>
    </div>
  </header>

    <main class="page">
    <style>
      .status-cancelled { background: rgba(246,70,93,.12); color: #f6465d; border: 1px solid #f6465d; }
      .notice { margin: 14px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 10px; background: var(--soft); font-size: 13px; }
      .msg { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-weight: 600; }
      .msg.show { display: block; }
      .msg.error { background: rgba(246,70,93,.12); color: #f6465d; }
      .msg.ok { background: var(--soft); border: 1px solid var(--green); }
    </style>

    <div class="escrow-banner">
      <div>
        <div style="font-size: 16px; font-weight: 800;">🛡️ Escrow-tracked order</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 2px;">
          While this order is open, the amount is reserved on the ad. Etp2p does not move money or USDT for you.
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <div id="statusBadge" class="status-badge status-pending">Loading…</div>
        <button class="btn small outline" id="bannerMyOrdersBtn" style="background:var(--panel);">📋 My Orders</button>
      </div>
    </div>

    <div class="card" id="orderCard"><p style="margin:0; color:var(--muted);">Loading your order…</p></div>
    <div class="msg" id="orderMsg" role="status"></div>
  </main>

  <div class="modal-overlay" id="myOrdersModal">
    <div class="orders-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px;">
        <h3 style="margin: 0; font-size: 18px; font-weight: 800;">My P2P orders</h3>
        <button class="btn small outline" id="closeOrdersModalBtn" style="padding: 4px 10px; border-radius: 8px;">✕ Close</button>
      </div>
      <div id="ordersModalList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { supabase, transitionOrder, listMyOrders } from "./services/supabase.js";
    import {
      LAST_ACTIVE_KEY,
      REAUTH_REQUIRED_KEY,
      SESSION_STARTED_KEY,
      SESSION_USER_KEY,
      clearSessionTracking,
      ensureSessionTracking,
      isSessionExpired,
      markReauthenticationRequired,
      recordSessionActivity,
    } from "./services/session.js";

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function money(value, currency) {
      const n = Number(value) || 0;
      if (currency === "ETB") return "Br " + new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
      return new Intl.NumberFormat("en-US", { style: "currency", currency, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    }

    function notify(msg) {
      const toast = $("toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3200);
    }

    // Theme
    function initTheme() {
      const isDark = localStorage.getItem("theme") !== "light";
      document.body.classList.toggle("dark-mode", isDark);
      document.body.classList.toggle("light-mode", !isDark);
      $("themeToggleBtn").textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }

    $("themeToggleBtn").onclick = () => {
      const isDark = document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode", !isDark);
      localStorage.setItem("theme", isDark ? "dark" : "light");
      $("themeToggleBtn").textContent = isDark ? "☀️ Light" : "🌙 Dark";
      $("themeToggleBtn").setAttribute("aria-pressed", String(isDark));
      document.body.classList.remove("theme-changing");
      void document.body.offsetWidth;
      document.body.classList.add("theme-changing");
      window.setTimeout(() => document.body.classList.remove("theme-changing"), 450);
    };

    initTheme();
    $("themeToggleBtn").setAttribute("aria-pressed", String(document.body.classList.contains("dark-mode")));

    // Order state comes only from the database (p2p_orders).
    const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const tradeId = new URLSearchParams(window.location.search).get("id");
    const STATUS = {
      pending: ["Waiting for payment", "status-pending"],
      payment_marked: ["Payment marked", "status-paid"],
      completed: ["Completed", "status-completed"],
      cancelled: ["Cancelled", "status-cancelled"],
    };
    let user = null;
    let order = null;
    let busy = false;
    let pollTimer = null;

    function showMsg(text, isError) {
      const box = $("orderMsg");
      box.textContent = text;
      box.className = "msg show " + (isError ? "error" : "ok");
    }

    function clearMsg() { $("orderMsg").className = "msg"; }

    function friendlyError(message) {
      if (/authenticator/i.test(message)) return "This step needs two-factor authentication (an authenticator) on your account. " + message;
      return message;
    }

    function guidance(role, o) {
      const fiat = money(o.fiat_amount, o.currency);
      const coin = Number(o.crypto_amount).toLocaleString("en-US", { maximumFractionDigits: 8 }) + " " + o.asset;
      if (o.status === "completed") return "The seller completed this order. " + coin + " was marked as delivered to the buyer.";
      if (o.status === "cancelled") return "This order was cancelled and the reserved " + o.asset + " went back to the ad.";
      if (o.status === "pending" && role === "buyer") return "Payment details are not shown in Etp2p yet. Do not send money until you have confirmed the seller's account name and number through a channel you trust. After you have paid " + fiat + " using " + o.payment_method + ", press “I’ve paid”.";
      if (o.status === "pending" && role === "seller") return "Waiting for the buyer to pay " + fiat + " using " + o.payment_method + ". You can complete the order once they mark it as paid.";
      if (o.status === "payment_marked" && role === "buyer") return "You marked this order as paid. The seller will confirm and complete it.";
      return "The buyer says " + fiat + " was sent using " + o.payment_method + ". Check that the money is in your account and send the " + coin + " before you complete the order.";
    }

    function actionsFor(role, o) {
      if (o.status === "pending" && role === "buyer") return [["mark_paid", "I’ve paid", true], ["cancel", "Cancel order", false]];
      if (o.status === "pending" && role === "seller") return [["cancel", "Cancel order", false]];
      if (o.status === "payment_marked" && role === "seller") return [["complete", "Complete order (money received)", true]];
      return [];
    }

    const CONFIRM = {
      mark_paid: "Confirm that you have already sent the payment to the seller.",
      complete: "Complete this order? This cannot be undone. Only continue if the money is in your account and you have sent the USDT.",
      cancel: "Cancel this order?",
    };
    const DONE = {
      mark_paid: "Marked as paid. The seller can now confirm.",
      complete: "Order completed.",
      cancel: "Order cancelled.",
    };

    function render() {
      const o = order;
      const role = user.id === o.buyer_id ? "buyer" : "seller";
      const [label, cls] = STATUS[o.status] || [o.status, "status-pending"];
      $("statusBadge").className = "status-badge " + cls;
      $("statusBadge").textContent = label;

      const items = [
        ["You are the", role === "buyer" ? "Buyer" : "Seller"],
        ["Fiat amount", money(o.fiat_amount, o.currency)],
        [o.asset + " in this order", Number(o.crypto_amount).toLocaleString("en-US", { maximumFractionDigits: 8 })],
        ["Rate", money(o.price_per_unit, o.currency) + " / " + o.asset],
        ["Payment method", o.payment_method],
        ["Merchant", o.merchant_handle],
      ];
      const actions = actionsFor(role, o);

      $("orderCard").innerHTML =
        '<div class="card-title"><span>Order details</span><span style="font-size:13px;color:var(--muted);font-weight:600;font-family:monospace;">#' + esc(o.id.slice(0, 8)) + "</span></div>" +
        '<div class="grid-2">' + items.map(([l, v]) => '<div class="detail-item"><div class="detail-label">' + esc(l) + '</div><div class="detail-val">' + esc(v) + "</div></div>").join("") + "</div>" +
        '<p class="notice">' + esc(guidance(role, o)) + "</p>" +
        (actions.length
          ? '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;">' + actions.map(([a, text, primary]) => '<button class="btn' + (primary ? " primary" : " outline") + '" data-action="' + a + '">' + esc(text) + "</button>").join("") + "</div>"
          : "");

      if (o.status === "completed" || o.status === "cancelled") stopPolling();
    }

    async function loadOrder() {
      const { data, error } = await supabase.from("p2p_orders").select("*").eq("id", tradeId).maybeSingle();
      if (error) {
        $("orderCard").innerHTML = "<p>Could not load this order: " + esc(error.message) + '</p><p><a href="./">Back to the marketplace</a></p>';
        stopPolling();
        return;
      }
      if (!data) {
        $("orderCard").innerHTML = '<p>This order was not found, or it belongs to another account.</p><p><a href="./">Back to the marketplace</a></p>';
        $("statusBadge").textContent = "Not found";
        stopPolling();
        return;
      }
      order = data;
      render();
    }

    async function runAction(action) {
      if (busy) return;
      if (!confirm(CONFIRM[action])) return;
      busy = true;
      document.querySelectorAll("[data-action]").forEach((b) => { b.disabled = true; });
      clearMsg();

      const { error } = await transitionOrder(order.id, action);
      busy = false;
      if (error) {
        showMsg(friendlyError(error.message), true);
        document.querySelectorAll("[data-action]").forEach((b) => { b.disabled = false; });
        return;
      }
      showMsg(DONE[action], false);
      await loadOrder();
    }

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    $("orderCard").onclick = (event) => {
      const button = event.target.closest("[data-action]");
      if (button) runAction(button.dataset.action);
    };

    // My orders drawer (from the database, not browser storage)
    async function openOrdersModal() {
      $("myOrdersModal").classList.add("show");
      const list = $("ordersModalList");
      list.innerHTML = '<p style="color:var(--muted);">Loading…</p>';
      const { data, error } = await listMyOrders();
      if (error) {
        list.innerHTML = '<p style="color:var(--muted);">Could not load your orders: ' + esc(error.message) + "</p>";
        return;
      }
      const rows = data || [];
      $("ordersCountBadge").textContent = rows.length;
      list.innerHTML = rows.length
        ? rows.map((o) => {
            const amount = Number(o.crypto_amount).toLocaleString("en-US", { maximumFractionDigits: 8 });
            const label = (STATUS[o.status] || [o.status])[0];
            return '<div style="padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
              '<div><div style="display:flex;align-items:center;gap:6px;"><b style="font-size:13px;font-family:monospace;">#' + esc(o.id.slice(0, 8)) + "</b>" +
              '<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--green);">' + esc(label) + "</span></div>" +
              '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' + esc(amount) + " " + esc(o.asset) + " · " + money(o.fiat_amount, o.currency) + "</div></div>" +
              '<a href="trade.html?id=' + encodeURIComponent(o.id) + '" class="btn small primary" style="text-decoration:none;padding:4px 10px;font-size:12px;">Open →</a></div>';
          }).join("")
        : '<p style="color:var(--muted);">You have no orders yet.</p>';
    }

    function closeOrdersModal() { $("myOrdersModal").classList.remove("show"); }

    $("headerMyOrdersBtn").onclick = openOrdersModal;
    $("bannerMyOrdersBtn").onclick = openOrdersModal;
    $("closeOrdersModalBtn").onclick = closeOrdersModal;
    $("myOrdersModal").onclick = (e) => { if (e.target === $("myOrdersModal")) closeOrdersModal(); };

    // Session handling (unchanged behavior: sign in again after the idle limit)
    let tradeSessionReady = false;
    let tradeExpiryPending = false;

    async function expireTradeSession() {
      if (tradeExpiryPending) return;
      tradeExpiryPending = true;
      tradeSessionReady = false;
      markReauthenticationRequired();
      clearSessionTracking();
      try { await supabase.auth.signOut(); } catch (_) {}
      window.location.replace("./?reauth=1");
    }

    function enforceTradeSessionExpiry() {
      if (tradeSessionReady && isSessionExpired()) void expireTradeSession();
    }

    function recordTradeActivity() {
      if (!tradeSessionReady) return;
      if (isSessionExpired() || !recordSessionActivity()) void expireTradeSession();
    }

    async function startPage(session) {
      user = session.user;
      if (!tradeId || !UUID_RE.test(tradeId)) {
        $("orderCard").innerHTML = '<p>No order selected.</p><p><a href="./">Back to the marketplace</a></p>';
        $("statusBadge").textContent = "No order";
        return;
      }
      await loadOrder();
      pollTimer = setInterval(() => { if (!document.hidden && !busy) loadOrder(); }, 10000);
    }

    async function authorizeTradePage() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session?.user) {
        clearSessionTracking();
        markReauthenticationRequired();
        window.location.replace("./?reauth=1");
        return;
      }
      if (!ensureSessionTracking(session) || isSessionExpired()) {
        await expireTradeSession();
        return;
      }
      tradeSessionReady = true;
      if (!recordSessionActivity()) {
        await expireTradeSession();
        return;
      }
      startPage(session);
    }

    ["pointerdown", "pointermove", "mousemove", "click", "keydown", "touchstart", "wheel", "scroll"]
      .forEach((name) => document.addEventListener(name, recordTradeActivity, { passive: true }));
    document.addEventListener("visibilitychange", enforceTradeSessionExpiry);
    window.addEventListener("focus", enforceTradeSessionExpiry);
    window.addEventListener("pageshow", enforceTradeSessionExpiry);
    window.addEventListener("storage", (event) => {
      if (
        event.key !== LAST_ACTIVE_KEY &&
        event.key !== SESSION_STARTED_KEY &&
        event.key !== SESSION_USER_KEY &&
        event.key !== REAUTH_REQUIRED_KEY
      ) return;

      if (
        tradeSessionReady &&
        !localStorage.getItem(LAST_ACTIVE_KEY) &&
        localStorage.getItem(REAUTH_REQUIRED_KEY) !== "1"
      ) {
        tradeSessionReady = false;
        window.location.replace("./");
        return;
      }
      enforceTradeSessionExpiry();
    });
    window.setInterval(enforceTradeSessionExpiry, 5000);
    supabase.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT" && tradeSessionReady) {
        tradeSessionReady = false;
        const reauthRequired = localStorage.getItem(REAUTH_REQUIRED_KEY) === "1";
        window.location.replace(reauthRequired ? "./?reauth=1" : "./");
      }
    });
    authorizeTradePage().catch(() => window.location.replace("./?reauth=1"));
  </script>
</body>
</html>
