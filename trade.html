<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escrow Trade - Etp2p</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <h2>Escrow Trade Details</h2>
    <div id="tradeInfo" style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px;">
      <p>Loading trade information...</p>
    </div>
    <div id="actionContainer"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { supabase } from "./services/supabase.js";
    import "./app.js"; // Brings in handleReleaseTrade and helpers

    const urlParams = new URLSearchParams(window.location.search);
    const tradeId = urlParams.get("id");

    async function loadTrade() {
      if (!tradeId) {
        document.getElementById("tradeInfo").innerHTML = "<p>No trade ID provided.</p>";
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      const { data: trade, error } = await supabase
        .from("trades")
        .select("*")
        .eq("id", tradeId)
        .single();

      if (error || !trade) {
        document.getElementById("tradeInfo").innerHTML = "<p>Trade not found or failed to load.</p>";
        return;
      }

      const isSeller = user && user.id === trade.seller_id;

      document.getElementById("tradeInfo").innerHTML = `
        <p><strong>Trade ID:</strong> ${trade.id}</p>
        <p><strong>Crypto Amount:</strong> ${trade.crypto_amount}</p>
        <p><strong>Fiat Amount:</strong> Br ${trade.fiat_amount}</p>
        <p><strong>Status:</strong> <span style="text-transform: uppercase; font-weight: bold; color: ${trade.status === 'released' ? 'green' : 'orange'}">${trade.status}</span></p>
      `;

      if (trade.status === "active" && isSeller) {
        document.getElementById("actionContainer").innerHTML = `
          <button class="btn primary" onclick="handleReleaseTrade('${trade.id}')">
            Release Escrow to Buyer
          </button>
        `;
      } else if (trade.status === "released") {
        document.getElementById("actionContainer").innerHTML = `
          <p style="color: green; font-weight: bold;">This trade has been successfully completed and funds released.</p>
        `;
      }
    }

    loadTrade();
  </script>
</body>
</html>
